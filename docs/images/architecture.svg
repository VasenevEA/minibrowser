<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="DejaVu Sans, Verdana, sans-serif">
  <rect width="920" height="430" rx="16" fill="#0b1020"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <!-- inputs -->
  <g font-size="13" fill="#e2e8f0">
    <rect x="24" y="40" width="150" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="99" y="64" text-anchor="middle" font-weight="bold">page.html</text>
    <text x="99" y="82" text-anchor="middle" fill="#94a3b8" font-size="11">files · http(s)</text>
    <rect x="24" y="114" width="150" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="99" y="138" text-anchor="middle" font-weight="bold">JavaScript</text>
    <text x="99" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">QuickJS · ES modules</text>
    <rect x="24" y="188" width="150" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="99" y="212" text-anchor="middle" font-weight="bold">touch</text>
    <text x="99" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">evdev · tslib</text>
    <rect x="24" y="262" width="150" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="99" y="286" text-anchor="middle" font-weight="bold">network</text>
    <text x="99" y="304" text-anchor="middle" fill="#94a3b8" font-size="11">fetch · WebSocket</text>
  </g>
  <!-- engine -->
  <rect x="220" y="28" width="420" height="300" rx="14" fill="#0f1a33" stroke="#38bdf8" stroke-width="2"/>
  <text x="430" y="54" text-anchor="middle" font-size="16" font-weight="bold" fill="#38bdf8">engine (pick one at build or run time)</text>
  <g font-size="12" fill="#e2e8f0">
    <rect x="240" y="70" width="185" height="150" rx="10" fill="#111a2e" stroke="#a78bfa"/>
    <text x="332" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#a78bfa">mb-core</text>
    <text x="332" y="114" text-anchor="middle">html5ever → DOM</text>
    <text x="332" y="134" text-anchor="middle">own CSS cascade</text>
    <text x="332" y="154" text-anchor="middle">Taffy flex / grid</text>
    <text x="332" y="174" text-anchor="middle">tiny-skia · resvg · fontdue</text>
    <text x="332" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">3.6 MB · box-tree damage</text>
    <rect x="437" y="70" width="185" height="150" rx="10" fill="#111a2e" stroke="#34d399"/>
    <text x="529" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#34d399">mb-blitz</text>
    <text x="529" y="114" text-anchor="middle">Blitz DOM</text>
    <text x="529" y="134" text-anchor="middle">Stylo (Firefox CSS)</text>
    <text x="529" y="154" text-anchor="middle">Taffy · Parley text</text>
    <text x="529" y="174" text-anchor="middle">tiny-skia painter</text>
    <text x="529" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">+6.5 MB · paint-command diff</text>
    <rect x="240" y="236" width="382" height="76" rx="10" fill="#111a2e" stroke="#fbbf24"/>
    <text x="431" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#fbbf24">live DOM for scripts</text>
    <text x="431" y="282" text-anchor="middle">nodes · events with bubbling · querySelector · classList</text>
    <text x="431" y="300" text-anchor="middle" fill="#94a3b8" font-size="11">the same dom-live.js over either engine</text>
  </g>
  <!-- outputs -->
  <g font-size="13" fill="#e2e8f0">
    <rect x="690" y="40" width="206" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="793" y="64" text-anchor="middle" font-weight="bold">mb-fb</text>
    <text x="793" y="82" text-anchor="middle" fill="#94a3b8" font-size="11">DRM/KMS (vsync) · fbdev</text>
    <rect x="690" y="114" width="206" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="793" y="138" text-anchor="middle" font-weight="bold">mb-slint</text>
    <text x="793" y="156" text-anchor="middle" fill="#94a3b8" font-size="11">HtmlView · panel platform</text>
    <rect x="690" y="188" width="206" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="793" y="212" text-anchor="middle" font-weight="bold">mb-headless</text>
    <text x="793" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">PNG · frames · scripted taps</text>
    <rect x="690" y="262" width="206" height="54" rx="10" fill="#111a2e" stroke="#334155"/>
    <text x="793" y="286" text-anchor="middle" font-weight="bold">WASM</text>
    <text x="793" y="304" text-anchor="middle" fill="#94a3b8" font-size="11">the engine in a web page</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M174 67 L218 100"/>
    <path d="M174 141 L218 262"/>
    <path d="M174 215 L218 275"/>
    <path d="M174 289 L218 290"/>
    <path d="M640 120 L688 67"/>
    <path d="M640 150 L688 141"/>
    <path d="M640 180 L688 215"/>
    <path d="M640 210 L688 289"/>
  </g>
  <text x="460" y="370" text-anchor="middle" font-size="13" fill="#94a3b8">RGBA pixels + damage rectangles → only what changed reaches the screen</text>
  <text x="460" y="396" text-anchor="middle" font-size="12" fill="#64748b">Cargo features: kms · mimalloc · net · blitz · http · panel · bindgen</text>
</svg>
