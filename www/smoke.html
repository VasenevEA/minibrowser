<!doctype html><meta charset="utf-8"><canvas id="c" width="800" height="480"></canvas><pre id="out">running</pre>
<script type="module">
import init, { init as engineInit, render_html, render_html_live, click_at, scroll } from './minibrowser.js';
const out = [];
try {
  await init(); engineInit();
  for (const d of ['demo1.html', 'demo6-js-counter.html', 'demo7-js-todo.html', 'demo8-js-hmi.html', 'demo5-js-clock.html']) {
    const html = await (await fetch('demo/' + d)).text();
    const s = render_html('c', html);
    out.push(d + ' load nodes=' + s.nodeCount + ' boxes=' + s.boxCount + ' ms=' + s.renderTime.toFixed(1));
    if (d.startsWith('demo8')) {
      const a = click_at('c', 45, 172), b = click_at('c', 499, 168);
      out.push('  clicks: ' + (a ? 'repaint' : 'none') + ', ' + (b ? 'repaint' : 'none'));
      const px = document.getElementById('c').getContext('2d').getImageData(470, 160, 1, 1).data;
      out.push('  START button pixel rgb=' + px[0] + ',' + px[1] + ',' + px[2]);
    }
    if (d.startsWith('demo5')) {
      const l = render_html_live('c', html);
      out.push('  live tick nodes=' + l.nodeCount);
    }
  }
} catch (e) { out.push('ERROR ' + e + ' ' + (e.stack || '')); }
document.getElementById('out').textContent = out.join('\n');
</script>
