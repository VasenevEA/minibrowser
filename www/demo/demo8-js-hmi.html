<html><body style="background:#1a1a2e;color:#e0e0e0;font-size:14px;margin:0;padding:10px;">
  <div style="background:#2d2d44;padding:8px;margin-bottom:10px;display:flex;">
    <span style="color:#4fc3f7;font-size:18px;">HMI Control Panel</span>
    <span id="status" style="color:#81c784;margin-left:auto;">● Online</span>
  </div>

  <div style="display:flex;gap:10px;">
    <div style="background:#263238;padding:15px;width:180px;">
      <div style="color:#90a4ae;font-size:12px;">Temperature</div>
      <div id="temp" style="color:#ff7043;font-size:32px;">22.0 °C</div>
      <div style="display:flex;gap:5px;margin-top:10px;">
        <button id="t-up" style="background:#c62828;color:white;padding:5px 15px;border:none;cursor:pointer;">▲</button>
        <button id="t-down" style="background:#1565c0;color:white;padding:5px 15px;border:none;cursor:pointer;">▼</button>
      </div>
    </div>

    <div style="background:#263238;padding:15px;width:180px;">
      <div style="color:#90a4ae;font-size:12px;">Pressure</div>
      <div id="pressure" style="color:#42a5f5;font-size:32px;">3.2 bar</div>
      <div id="p-bar" style="background:#37474f;height:20px;margin-top:10px;">
        <div id="p-fill" style="background:#42a5f5;height:20px;width:64%;"></div>
      </div>
    </div>

    <div style="background:#263238;padding:15px;width:180px;">
      <div style="color:#90a4ae;font-size:12px;">Pump</div>
      <div id="pump-status" style="color:#66bb6a;font-size:24px;">● Running</div>
      <button id="pump-toggle" style="background:#c62828;color:white;padding:8px 16px;border:none;cursor:pointer;margin-top:10px;">STOP</button>
    </div>
  </div>

  <div style="background:#263238;padding:15px;margin-top:10px;">
    <div style="color:#90a4ae;margin-bottom:5px;">Event Log</div>
    <div id="log" style="font-size:12px;color:#b0bec5;height:80px;overflow:hidden;"></div>
  </div>

  <script>
    var temp = 22.0;
    var pressure = 3.2;
    var pumpOn = true;
    var logs = [];

    function addLog(msg) {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var s = now.getSeconds();
      var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
      logs.unshift(pad(h) + ':' + pad(m) + ':' + pad(s) + ' ' + msg);
      if (logs.length > 8) logs.pop();
    }

    function render() {
      document.getElementById('temp').textContent = temp.toFixed(1) + ' °C';
      document.getElementById('temp').style.color = temp > 80 ? '#ef5350' : temp > 60 ? '#ffa726' : '#ff7043';

      document.getElementById('pressure').textContent = pressure.toFixed(1) + ' bar';
      var pPct = Math.min(100, (pressure / 5) * 100);
      document.getElementById('p-fill').style.width = pPct + '%';
      document.getElementById('p-fill').style.backgroundColor = pressure > 4 ? '#ef5350' : '#42a5f5';

      document.getElementById('pump-status').textContent = pumpOn ? '● Running' : '○ Stopped';
      document.getElementById('pump-status').style.color = pumpOn ? '#66bb6a' : '#ef5350';
      document.getElementById('pump-toggle').textContent = pumpOn ? 'STOP' : 'START';
      document.getElementById('pump-toggle').style.backgroundColor = pumpOn ? '#c62828' : '#2e7d32';

      document.getElementById('log').innerHTML = logs.map(function(l) { return '<div>' + l + '</div>'; }).join('');
    }

    document.getElementById('t-up').onclick = function() {
      temp += 2.5;
      addLog('Temp setpoint +2.5 -> ' + temp.toFixed(1) + '°C');
      render();
    };

    document.getElementById('t-down').onclick = function() {
      temp -= 2.5;
      addLog('Temp setpoint -2.5 -> ' + temp.toFixed(1) + '°C');
      render();
    };

    document.getElementById('pump-toggle').onclick = function() {
      pumpOn = !pumpOn;
      addLog(pumpOn ? 'Pump STARTED' : 'Pump STOPPED');
      render();
    };

    addLog('System initialized');
    addLog('Pump online, T=' + temp.toFixed(1) + '°C, P=' + pressure.toFixed(1) + 'bar');
    render();
  </script>
</body></html>
