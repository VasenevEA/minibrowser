<html>
<head>
<style>
body { margin: 0; background: #0b0f17; color: #e6ebf2; font-size: 14px; }
.top { padding: 10px 16px; background: #121926; border-bottom: 2px solid #1f2a3d; font-size: 18px; font-weight: bold; color: #38bdf8; }
.row { display: flex; gap: 12px; padding: 12px 16px; }
.card { flex: 1; background: #131a26; border: 1px solid #222c3e; border-radius: 8px; padding: 10px; text-align: center; }
.label { color: #7c899e; font-size: 12px; }
.value { font-size: 24px; font-weight: bold; }
</style>
</head>
<body>
  <div class="top">Mimic diagram · SVG</div>
  <div class="row">
    <div class="card">
      <div class="label">Pressure, bar</div>
      <svg width="200" height="120" viewBox="0 0 200 120">
        <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="#1f2a3d" stroke-width="14"/>
        <path d="M 20 110 A 80 80 0 0 1 140 41" fill="none" stroke="#34d399" stroke-width="14"/>
        <path d="M 140 41 A 80 80 0 0 1 180 110" fill="none" stroke="#f87171" stroke-width="14"/>
        <g id="needle" transform="rotate(-30 100 110)">
          <line x1="100" y1="110" x2="100" y2="42" stroke="#e6ebf2" stroke-width="4" stroke-linecap="round"/>
        </g>
        <circle cx="100" cy="110" r="8" fill="#e6ebf2"/>
      </svg>
      <div id="pv" class="value">3.2</div>
    </div>
    <div class="card">
      <div class="label">Tank, %</div>
      <svg width="120" height="150" viewBox="0 0 120 150">
        <rect x="20" y="10" width="80" height="130" rx="8" fill="#0f172a" stroke="#334155" stroke-width="3"/>
        <rect id="level" x="23" y="75" width="74" height="62" rx="5" fill="#38bdf8"/>
        <line x1="20" y1="40" x2="30" y2="40" stroke="#f87171" stroke-width="2"/>
      </svg>
      <div id="lv" class="value" style="color:#38bdf8;">50</div>
    </div>
    <div class="card">
      <div class="label">Pump</div>
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle cx="75" cy="75" r="50" fill="#0f172a" stroke="#334155" stroke-width="4"/>
        <g id="rotor" transform="rotate(0 75 75)">
          <path d="M75 75 L75 35 A40 40 0 0 1 110 55 Z" fill="#34d399"/>
          <path d="M75 75 L110 95 A40 40 0 0 1 75 115 Z" fill="#34d399" opacity="0.7"/>
          <path d="M75 75 L40 95 A40 40 0 0 1 40 55 Z" fill="#34d399" opacity="0.4"/>
        </g>
      </svg>
      <div id="st" class="value" style="color:#34d399;">RUNNING</div>
    </div>
  </div>
  <script>
    var t = 0;
    function update() {
      t++;
      var p = 3.2 + Math.sin(t / 5) * 1.4;
      var angle = -90 + (p / 6) * 180;
      document.getElementById('needle').setAttribute('transform', 'rotate(' + angle.toFixed(1) + ' 100 110)');
      document.getElementById('pv').textContent = p.toFixed(1);
      var level = 50 + Math.sin(t / 9) * 35;
      var h = Math.round(124 * level / 100);
      document.getElementById('level').setAttribute('y', String(137 - h));
      document.getElementById('level').setAttribute('height', String(h));
      document.getElementById('lv').textContent = Math.round(level);
      document.getElementById('rotor').setAttribute('transform', 'rotate(' + (t * 30 % 360) + ' 75 75)');
    }
    update();
    setInterval(update, 500);
  </script>
</body>
</html>
