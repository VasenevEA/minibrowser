<html>
<head>
<style>
body { margin: 0; background: #0a0d13; color: #e8edf5; font-size: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 14px; background: #111722; border-bottom: 1px solid #212938; }
.brand { font-size: 16px; font-weight: bold; color: #38bdf8; }
.muted { color: #7c899e; font-size: 12px; }
.row { display: flex; gap: 10px; padding: 8px 10px 0 10px; }
.card { flex: 1; background: #131822; border: 1px solid #212938; border-radius: 10px; padding: 8px; text-align: center; }
.title { color: #7c899e; font-size: 12px; }
.value { font-size: 22px; font-weight: bold; }
.btns { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
.btn { background: #1c2533; color: #e8edf5; border: 1px solid #2c3a50; border-radius: 8px; padding: 8px 0; width: 52px; font-size: 16px; font-weight: bold; text-align: center; }
.btn.on { background: #0e3a52; border-color: #38bdf8; color: #38bdf8; }
.wide { width: 120px; }
.arena { position: relative; height: 118px; margin: 8px 10px 0 10px; background: #0f141d; border: 1px solid #212938; border-radius: 10px; overflow: hidden; }
.hud { position: absolute; left: 12px; top: 8px; font-size: 12px; color: #7c899e; }
.score { position: absolute; right: 12px; top: 6px; font-size: 20px; font-weight: bold; color: #a78bfa; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">MiniBrowser · animations</div>
    <div><span id="fps" class="muted">—</span>  <span id="clock" class="muted"></span></div>
  </div>

  <div class="row">
    <div class="card">
      <div class="title">Pressure, bar</div>
      <svg width="200" height="116" viewBox="0 0 200 116">
        <path d="M 20 106 A 80 80 0 0 1 180 106" fill="none" stroke="#1f2a3d" stroke-width="14" stroke-linecap="round"/>
        <path id="arc" d="M 20 106 A 80 80 0 0 1 20 106" fill="none" stroke="#34d399" stroke-width="14" stroke-linecap="round"/>
        <g id="needle" transform="rotate(-90 100 106)">
          <line x1="100" y1="106" x2="100" y2="40" stroke="#e8edf5" stroke-width="4" stroke-linecap="round"/>
        </g>
        <circle cx="100" cy="106" r="8" fill="#e8edf5"/>
      </svg>
      <div id="pv" class="value">0.0</div>
      <div class="btns"><div id="pdn" class="btn">−</div><div id="pset" class="muted" style="width:60px;padding-top:10px;">target 3</div><div id="pup" class="btn">+</div></div>
    </div>

    <div class="card">
      <div class="title">Fan</div>
      <svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="62" fill="#0f172a" stroke="#334155" stroke-width="3"/>
        <g id="fan" transform="rotate(0 66 66)">
          <path d="M66 66 C 60 40, 62 14, 80 10 C 92 20, 84 46, 66 66 Z" fill="#38bdf8"/>
          <path d="M66 66 C 92 60, 118 62, 122 80 C 112 92, 86 84, 66 66 Z" fill="#38bdf8" fill-opacity="0.8"/>
          <path d="M66 66 C 72 92, 70 118, 52 122 C 40 112, 48 86, 66 66 Z" fill="#38bdf8" fill-opacity="0.65"/>
          <path d="M66 66 C 40 72, 14 70, 10 52 C 20 40, 46 48, 66 66 Z" fill="#38bdf8" fill-opacity="0.5"/>
        </g>
        <circle cx="66" cy="66" r="9" fill="#e8edf5"/>
      </svg>
      <div id="rpm" class="value" style="color:#38bdf8;">0 rpm</div>
      <div class="btns"><div id="f0" class="btn on">0</div><div id="f1" class="btn">1</div><div id="f2" class="btn">2</div><div id="f3" class="btn">3</div></div>
    </div>

    <div class="card">
      <div class="title">Tank and valve</div>
      <svg width="190" height="132" viewBox="0 0 190 132">
        <path d="M 0 30 L 70 30" stroke="#1f2a3d" stroke-width="10"/>
        <path id="flow" d="M 0 30 L 70 30" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 8" stroke-dashoffset="0" opacity="0"/>
        <rect x="70" y="8" width="104" height="120" rx="10" fill="#0f172a" stroke="#334155" stroke-width="3"/>
        <rect id="level" x="73" y="100" width="98" height="25" rx="7" fill="#38bdf8"/>
        <path id="wave" d="M 73 100 L 171 100" stroke="#7dd3fc" stroke-width="3" fill="none"/>
      </svg>
      <div id="lv" class="value" style="color:#38bdf8;">20%</div>
      <div class="btns"><div id="valve" class="btn wide">OPEN</div></div>
    </div>
  </div>

  <div id="arena" class="arena">
    <svg width="778" height="118" viewBox="0 0 778 118">
      <circle id="ball" cx="50" cy="50" r="30" fill="#a78bfa"/>
    </svg>
    <div class="hud">Catch the ball: tap it</div>
    <div id="score" class="score">0</div>
  </div>

  <script>
    function $(id) { return document.getElementById(id); }
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    // Text only when it changes: an SVG-only frame skips styling and layout.
    var shown = {};
    function text(id, t) { if (shown[id] !== t) { shown[id] = t; $(id).textContent = t; } }

    // Pressure gauge: the needle eases toward the target.
    var target = 3, p = 0, pShown = -1;
    $('pup').onclick = function () { target = Math.min(6, target + 1); $('pset').textContent = 'target ' + target; };
    $('pdn').onclick = function () { target = Math.max(0, target - 1); $('pset').textContent = 'target ' + target; };

    // Fan: speed ramps with inertia.
    var speed = 0, want = 0, angle = 0;
    [0, 1, 2, 3].forEach(function (s) {
      $('f' + s).onclick = function () {
        want = s;
        for (var i = 0; i < 4; i++) $('f' + i).className = i == s ? 'btn on' : 'btn';
      };
    });

    // Tank: the open valve fills it, closed it drains.
    var open = false, level = 20, flowOff = 0, phase = 0;
    $('valve').onclick = function () {
      open = !open;
      $('valve').textContent = open ? 'CLOSE' : 'OPEN';
      $('valve').className = open ? 'btn wide on' : 'btn wide';
      $('flow').setAttribute('opacity', open ? '1' : '0');
    };

    // Catch the ball: the arena gets the tap, the ball is a circle in its SVG.
    var bx = 50, by = 50, vx = 2.2, vy = 1.4, score = 0, flash = 0;
    $('arena').onclick = function (e) {
      var dx = e.offsetX - bx, dy = e.offsetY - by;
      if (dx * dx + dy * dy > 45 * 45) return;
      score++;
      $('score').textContent = score;
      flash = 8;
      vx *= 1.12; vy *= 1.12;
    };

    var last = 0, frames = 0, fpsAt = 0;
    function frame(now) {
      var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
      last = now;

      // Gauge
      p += (target - p) * Math.min(1, dt * 3);
      if (Math.abs(p - pShown) > 0.004) {
        pShown = p;
        var a = -90 + p / 6 * 180;
        $('needle').setAttribute('transform', 'rotate(' + a.toFixed(1) + ' 100 106)');
        var r = (a - 90) * Math.PI / 180;
        var ex = 100 + 80 * Math.cos(r), ey = 106 + 80 * Math.sin(r);
        $('arc').setAttribute('d', 'M 20 106 A 80 80 0 0 1 ' + ex.toFixed(1) + ' ' + ey.toFixed(1));
        $('arc').setAttribute('stroke', p < 4 ? '#34d399' : p < 5 ? '#fbbf24' : '#f87171');
        text('pv', p.toFixed(1));
      }

      // Fan
      speed += (want - speed) * Math.min(1, dt * 1.5);
      if (speed > 0.01) {
        angle = (angle + speed * 400 * dt) % 360;
        $('fan').setAttribute('transform', 'rotate(' + angle.toFixed(0) + ' 66 66)');
      }
      text('rpm', Math.round(speed * 50) * 10 + ' rpm');

      // Tank
      var before = level;
      level = Math.max(5, Math.min(95, level + (open ? 8 : -3) * dt));
      phase += dt * 6;
      if (open) {
        flowOff = (flowOff - dt * 60) % 18;
        $('flow').setAttribute('stroke-dashoffset', flowOff.toFixed(0));
      }
      if (open || Math.abs(level - before) > 0.01) {
        var h = Math.round(114 * level / 100), top = 125 - h, d = 'M 73 ' + top;
        for (var x = 73; x <= 171; x += 7) d += ' L ' + x + ' ' + (top + Math.sin(x / 9 + phase) * (open ? 2.5 : 1)).toFixed(1);
        $('level').setAttribute('y', String(top));
        $('level').setAttribute('height', String(h));
        $('wave').setAttribute('d', d);
        text('lv', Math.round(level) + '%');
      }

      // Ball
      bx += vx * dt * 60; by += vy * dt * 60;
      if (bx < 30) { bx = 30; vx = -vx; }
      if (bx > 748) { bx = 748; vx = -vx; }
      if (by < 30) { by = 30; vy = -vy; }
      if (by > 88) { by = 88; vy = -vy; }
      $('ball').setAttribute('cx', bx.toFixed(1));
      $('ball').setAttribute('cy', by.toFixed(1));
      if (flash > 0) { flash--; $('ball').setAttribute('fill', flash > 0 ? '#fbbf24' : '#a78bfa'); }

      frames++;
      if (now - fpsAt >= 1000) {
        $('fps').textContent = frames + ' fps';
        frames = 0; fpsAt = now;
        var d2 = new Date();
        $('clock').textContent = pad(d2.getHours()) + ':' + pad(d2.getMinutes());
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
