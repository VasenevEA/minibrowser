<html><body style="background:#1a1a2e;color:white;padding:20px;font-size:16px;">
  <h1 style="color:#4fc3f7;">JS Demo: Counter App</h1>

  <div style="display:flex;gap:10px;margin:20px 0;">
    <button id="dec" style="background:#c62828;color:white;padding:10px 20px;font-size:20px;border:none;cursor:pointer;">-</button>
    <div id="count" style="font-size:48px;color:#66bb6a;width:120px;text-align:center;">0</div>
    <button id="inc" style="background:#2e7d32;color:white;padding:10px 20px;font-size:20px;border:none;cursor:pointer;">+</button>
  </div>

  <button id="reset" style="background:#1565c0;color:white;padding:8px 16px;font-size:14px;border:none;cursor:pointer;">Reset</button>

  <div style="margin-top:20px;background:#263238;padding:15px;">
    <div style="color:#90a4ae;font-size:12px;">History</div>
    <div id="history" style="color:#b0bec5;font-size:14px;"></div>
  </div>

  <script>
    var count = 0;
    var clickLog = [];

    function render() {
      document.getElementById('count').textContent = '' + count;
      document.getElementById('count').style.color = count > 0 ? '#66bb6a' : count < 0 ? '#ef5350' : '#ffffff';
      document.getElementById('history').textContent = clickLog.slice(-10).join(', ');
    }

    document.getElementById('inc').onclick = function() {
      count++;
      clickLog.push('+1');
      render();
    };

    document.getElementById('dec').onclick = function() {
      count--;
      clickLog.push('-1');
      render();
    };

    document.getElementById('reset').onclick = function() {
      count = 0;
      clickLog.push('R');
      render();
    };

    render();
  </script>
</body></html>
