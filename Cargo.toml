[workspace]
members = [".", "crates/mb-core", "crates/mb-qjs", "crates/mb-headless", "crates/mb-fb", "crates/mb-blitz"]
resolver = "2"

[package]
name = "minibrowser"
version = "0.8.0"
edition = "2021"
description = "MiniBrowser for the web: the mb-core engine on a <canvas>, scripts on the browser's own JS."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mb-core = { path = "crates/mb-core" }
log = "0.4"
wasm-logger = "0.2"
serde_json = "1"

# WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlIFrameElement",
    "CanvasRenderingContext2d", "ImageData",
    "Event", "MouseEvent", "KeyboardEvent", "InputEvent",
    "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "console",
    "Performance",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
