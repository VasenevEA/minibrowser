[package]
name = "minibrowser"
version = "0.7.0"
edition = "2021"
description = "MiniBrowser — modular browser engine in Rust/WASM. Cyrillic font, text wrapping, flex layout, inline flow, JS interactivity."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Always
log = "0.4"
wasm-logger = "0.2"
anyhow = "1"
serde_json = "1"

# HTML parsing
html5ever = "0.29"
markup5ever = "0.14"
tendril = "0.4"

# CSS parsing
cssparser = "0.34"

# 2D rendering
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

# Image decoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Font rendering
fontdue = "0.9"

# WASM
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement",
    "HtmlCanvasElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlIFrameElement",
    "CanvasRenderingContext2d", "ImageData",
    "Event", "MouseEvent", "KeyboardEvent", "InputEvent",
    "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "console",
    "Performance",
] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
