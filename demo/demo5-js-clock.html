<html><body style="background:#1a1a2e;color:white;padding:20px;font-size:16px;">
  <h1 style="color:#4fc3f7;">JS Demo: Live Clock</h1>
  <div id="clock" style="font-size:48px;color:#66bb6a;margin:20px 0;"></div>
  <div id="date" style="color:#90a4ae;font-size:18px;"></div>
  <div style="margin-top:30px;background:#263238;padding:15px;">
    <div style="color:#90a4ae;font-size:12px;">Elapsed since load</div>
    <div id="elapsed" style="font-size:24px;color:#ff7043;"></div>
  </div>
  <script>
    var start = Date.now();
    function update() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var s = now.getSeconds();
      var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
      document.getElementById('clock').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);

      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('date').textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();

      var elapsed = Math.floor((Date.now() - start) / 1000);
      var em = Math.floor(elapsed / 60);
      var es = elapsed % 60;
      document.getElementById('elapsed').textContent = em + 'm ' + pad(es) + 's';
    }
    update();
  </script>
</body></html>
