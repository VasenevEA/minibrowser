<html><body style="background-color:#1a1a2e;color:white;padding:20px;">
  <h1 id="title">Loading...</h1>
  <div id="counter" style="font-size:32px;color:#4fc3f7;">0</div>
  <div id="output"></div>
  <div id="list" style="margin-top:20px;"></div>
  <script>
    document.getElementById('title').textContent = 'JavaScript Works!';
    var count = 0;
    for (var i = 0; i < 5; i++) {
      count += i;
    }
    document.getElementById('counter').textContent = 'Sum: ' + count;
    var el = document.getElementById('output');
    el.textContent = 'Generated by JavaScript';
    el.style.color = '#66bb6a';
    el.style.marginTop = '20px';
    el.style.fontSize = '18px';
    console.log('Script executed successfully, sum =', count);
  </script>
</body></html>
