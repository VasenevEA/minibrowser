[package]
name = "mb-fb"
version = "0.8.0"
edition = "2021"
description = "MiniBrowser on a Linux framebuffer with touch input (embedded panels such as the T113)."
license = "MIT"

[dependencies]
mb-core = { path = "../mb-core" }
mb-qjs = { path = "../mb-qjs" }
libc = "0.2"
log = "0.4"
drm = { version = "0.14", optional = true }
drm-fourcc = { version = "2.2.0", optional = true }
mb-blitz = { path = "../mb-blitz", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }

[features]
# fetch/XHR over http(s) and WebSockets for scripts.
net = ["mb-qjs/net"]
bindgen = ["mb-qjs/bindgen"]
default = ["kms", "mimalloc"]
# DRM/KMS output (double buffering with vsync); without it only fbdev.
kms = ["dep:drm", "dep:drm-fourcc"]
# Blitz engine (Stylo + Taffy + Parley) next to mb-core's: --engine blitz.
blitz = ["dep:mb-blitz"]
# musl's malloc is slow; the engine allocates a lot per frame.
mimalloc = ["dep:mimalloc"]
