[package]
name = "mb-headless"
version = "0.8.0"
edition = "2021"
description = "Renders an HTML page to a PNG with MiniBrowser, optionally after taps and timers."
license = "MIT"

[dependencies]
mb-core = { path = "../mb-core" }
mb-qjs = { path = "../mb-qjs" }
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# fetch/XHR over http(s) and WebSockets for scripts.
net = ["mb-qjs/net"]
