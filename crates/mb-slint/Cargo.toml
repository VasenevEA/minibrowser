[package]
name = "mb-slint"
version = "0.8.0"
edition = "2021"
description = "MiniBrowser inside Slint: an HtmlView element showing a live HTML/CSS/JS page."
license = "MIT"

[dependencies]
mb-core = { path = "../mb-core" }
mb-qjs = { path = "../mb-qjs" }
mb-blitz = { path = "../mb-blitz", optional = true }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-18"] }

[features]
default = ["desktop"]
# A window on the desktop (winit, software renderer).
desktop = ["slint/backend-winit", "slint/renderer-software"]
# A panel without a window manager: Slint's linuxkms backend, software renderer.
kms = ["slint/backend-linuxkms-noseat", "slint/renderer-software"]
# Pages on Blitz (Stylo + Taffy + Parley) instead of mb-core's engine.
blitz = ["dep:mb-blitz"]

[dev-dependencies]
png = "0.17"
