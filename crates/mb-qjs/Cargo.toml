[package]
name = "mb-qjs"
version = "0.8.0"
edition = "2021"
description = "MiniBrowser JsHost on QuickJS, for native builds."
license = "MIT"

[dependencies]
serde_json = "1"
mb-core = { path = "../mb-core" }
log = "0.4"
rquickjs = { version = "0.9", features = ["loader"] }
ureq = { version = "3.5", optional = true, default-features = false, features = ["rustls", "gzip"] }
tungstenite = { version = "0.30", optional = true, default-features = false, features = ["handshake"] }

[features]
# fetch/XHR over http(s) and WebSockets (ws://) for scripts, on threads.
net = ["dep:ureq", "dep:tungstenite"]
# armv7-musl has no prebuilt QuickJS bindings: generate them (needs LIBCLANG_PATH).
bindgen = ["rquickjs/bindgen"]

[[example]]
name = "ws_feed"
required-features = ["net"]
